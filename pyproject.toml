[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-fleet"
version = "0.1.0"
description = "Run coding agents in parallel git worktrees inside sandboxes, shard tests and review diffs before merge"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ayush Gawai" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "pytest>=8.2",
]

[project.optional-dependencies]
dev = []

[project.scripts]
fleet = "agentfleet.cli:main"

[tool.setuptools.packages.find]
include = ["agentfleet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
